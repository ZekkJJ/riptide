[package]
name = "riptide-daemon"
description = "Local service, HTTP API and web UI for the Riptide download manager"
keywords = ["download", "download-manager", "http", "hls", "dash"]
categories = ["command-line-utilities", "network-programming", "multimedia"]
readme = "../../README.md"
homepage = "https://github.com/Bloxive/riptide"
documentation = "https://docs.rs/riptide-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "riptided"
path = "src/main.rs"

[dependencies]
riptide-core = { path = "../riptide-core" }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
