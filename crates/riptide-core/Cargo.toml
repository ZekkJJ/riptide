[package]
name = "riptide-core"
description = "Multi-segment download engine with dynamic work-stealing chunk allocation, resume and HLS/DASH support"
keywords = ["download", "download-manager", "http", "hls", "dash"]
categories = ["command-line-utilities", "network-programming", "multimedia"]
readme = "../../README.md"
homepage = "https://github.com/ZekkJJ/riptide"
documentation = "https://docs.rs/riptide-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
quick-xml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
percent-encoding = { workspace = true }
dirs = { workspace = true }
# Pure-Rust AES-128-CBC, for standard (non-DRM) HLS segment decryption. aes 0.8 and
# cbc 0.1 are the pair built on cipher 0.4; newer majors of either need the other bumped too.
aes = "0.8"
cbc = { version = "0.1.2", features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time", "io-util", "test-util"] }
