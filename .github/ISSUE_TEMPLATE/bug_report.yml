name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security problems — see
        [SECURITY.md](https://github.com/ZekkJJ/riptide/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: >
        The exact command or the steps in the UI. Redact anything private — a URL that shows
        the same behaviour is more useful than one we cannot try.
      placeholder: |
        riptide https://example.com/file.iso -n 8
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Riptide version
      description: Output of `riptide --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part
      options:
        - CLI (riptide)
        - Service or web UI (riptided)
        - Browser extension
        - Streaming (HLS/DASH)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Re-run with `-v` and paste the output. For a stalled or corrupted download, the
        `.rtstate` file beside the partial payload is plain JSON and is the single most useful
        thing you can attach.
      render: shell
